    <style>
      /* ── RESET ───────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --blue:  #1DA1F2;
        --green: #1F9D55;
        --white: #f0faff;
        --bg:    #04111c;
      }

      /* ── LOADER GLOBAL ───────────────────────── */
      #netpro-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        z-index: 99999;
        font-family: 'Nunito', sans-serif;
        transition: opacity .9s ease, visibility .9s ease;
      }
      #netpro-loader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ── FOND RADIAL ─────────────────────────── */
      .nl-bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 80% 60% at 10% 90%, rgba(31,157,85,.2)   0%, transparent 55%),
          radial-gradient(ellipse 70% 50% at 90% 10%, rgba(29,161,242,.22) 0%, transparent 55%),
          radial-gradient(ellipse 50% 50% at 50% 50%, rgba(13,60,90,.6)    0%, transparent 70%),
          var(--bg);
        animation: nlBgBreath 6s ease-in-out infinite alternate;
      }
      @keyframes nlBgBreath { from{opacity:1} to{opacity:.75} }

      /* ── BULLES ──────────────────────────────── */
      .nl-bubbles { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
      .nl-bubble  { position:absolute; border-radius:50%; animation:nlBubbleRise linear infinite; opacity:0; }
      @keyframes nlBubbleRise {
        0%  { transform:translateY(110vh) scale(1); opacity:0; }
        10% { opacity:1; }
        90% { opacity:.4; }
        100%{ transform:translateY(-10vh) scale(.5); opacity:0; }
      }

      /* ── RIPPLES ─────────────────────────────── */
      .nl-ripple-wrap { position:absolute; top:50%; left:50%; pointer-events:none; }
      .nl-ripple { position:absolute; border-radius:50%; transform:translate(-50%,-50%) scale(0); animation:nlRipple 5s ease-out infinite; }
      .nl-ripple:nth-child(1){ width:220px; height:220px; border:1px solid rgba(29,161,242,.28); animation-delay:0s; }
      .nl-ripple:nth-child(2){ width:340px; height:340px; border:1px solid rgba(31,157,85,.22);  animation-delay:1.2s; }
      .nl-ripple:nth-child(3){ width:460px; height:460px; border:1px solid rgba(29,161,242,.16); animation-delay:2.4s; }
      .nl-ripple:nth-child(4){ width:580px; height:580px; border:1px solid rgba(31,157,85,.1);   animation-delay:3.6s; }
      @keyframes nlRipple {
        0%  { transform:translate(-50%,-50%) scale(0); opacity:1; }
        100%{ transform:translate(-50%,-50%) scale(1); opacity:0; }
      }

      /* ── COINS ───────────────────────────────── */
      .nl-corner { position:absolute; width:55px; height:55px; border-style:solid; }
      .nl-corner.tl{ top:22px;    left:22px;  border-width:2px 0 0 2px; border-color:var(--blue);  border-radius:6px 0 0 0; }
      .nl-corner.tr{ top:22px;    right:22px; border-width:2px 2px 0 0; border-color:var(--green); border-radius:0 6px 0 0; }
      .nl-corner.bl{ bottom:22px; left:22px;  border-width:0 0 2px 2px; border-color:var(--green); border-radius:0 0 0 6px; }
      .nl-corner.br{ bottom:22px; right:22px; border-width:0 2px 2px 0; border-color:var(--blue);  border-radius:0 0 6px 0; }

      /* ── CENTRE ──────────────────────────────── */
      .nl-center { position:relative; display:flex; flex-direction:column; align-items:center; }

      /* ── ICÔNE ───────────────────────────────── */
      .nl-icon-wrap {
        position:relative; width:90px; height:90px; margin-bottom:30px;
        opacity:0; transform:scale(.5);
        animation:nlPopIn .8s cubic-bezier(.34,1.56,.64,1) .3s forwards;
      }
      @keyframes nlPopIn { to{ opacity:1; transform:scale(1); } }

      .nl-icon-ring {
        position:absolute; inset:0; border-radius:50%;
        border:2px solid transparent;
        background: linear-gradient(var(--bg),var(--bg)) padding-box,
                    linear-gradient(135deg,var(--blue),var(--green)) border-box;
        animation:nlSpin 3s linear infinite;
      }
      @keyframes nlSpin { to{ transform:rotate(360deg); } }

      .nl-icon-glow {
        position:absolute; inset:6px; border-radius:50%;
        background:radial-gradient(circle,rgba(29,161,242,.12),rgba(31,157,85,.1));
      }

      .nl-icon-wrap svg {
        position:absolute; inset:0; margin:auto;
        width:48px; height:48px;
        filter:drop-shadow(0 0 14px rgba(29,161,242,.6));
      }

      /* ── TEXTE ───────────────────────────────── */
      .nl-brand-wrap {
        opacity:0; transform:translateY(18px);
        animation:nlSlideUp .8s cubic-bezier(.22,1,.36,1) .7s forwards;
      }
      @keyframes nlSlideUp { to{ opacity:1; transform:translateY(0); } }

      .nl-brand {
        font-family:'Raleway', sans-serif;
        font-weight:700;
        font-size:clamp(2rem,5vw,3rem);
        letter-spacing:.1em;
        text-transform:uppercase;
        color:var(--white);
        text-align:center;
      }

      .nl-brand .nl-green { color:var(--green); }

      .nl-tagline {
        font-weight:300; font-size:.66rem; letter-spacing:.42em;
        text-transform:uppercase; color:rgba(160,210,240,.55);

      /* ── SÉPARATEUR ──────────────────────────── */
      .nl-divider {
        width:0; height:2px; margin:24px auto; border-radius:2px;
        background:linear-gradient(90deg,var(--blue),var(--green));
        box-shadow:0 0 14px rgba(29,161,242,.45);
        animation:nlGrow 1s ease .95s forwards;
      }
      @keyframes nlGrow { to{ width:190px; } }

      /* ── STATUS ──────────────────────────────── */
      .nl-status {
        font-size:.68rem; letter-spacing:.22em; text-transform:uppercase;
        color:rgba(160,210,240,.45); margin-bottom:14px; min-height:1em;
        opacity:0; animation:nlSlideUp .6s ease 1.1s forwards;

      /* ── BARRE ───────────────────────────────── */
      .nl-progress-wrap { width:250px; opacity:0; animation:nlSlideUp .6s ease 1.1s forwards; }

      .nl-track {
        height:5px; background:rgba(255,255,255,.07);

      .nl-fill {
        height:100%; width:0%; border-radius:99px;
        background:linear-gradient(90deg,var(--blue),var(--green));
        box-shadow:0 0 16px rgba(29,161,242,.7);

      }
      .nl-fill::after {
        content:''; position:absolute; right:-2px; top:50%;
        transform:translateY(-50%);
        width:9px; height:9px; border-radius:50%;

      .nl-progress-info { display:flex; justify-content:space-between; margin-top:10px; }
      .nl-pct  { font-size:.75rem; font-weight:700; color:var(--blue); letter-spacing:.05em; }
      .nl-step { font-size:.62rem; color:rgba(160,210,240,.4); letter-spacing:.1em; }
    </style>
  <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;line-height:1.6;color:#333;background:#fff;overflow-x:hidden}html{scroll-behavior:smooth}</style><link rel="stylesheet" href="styles-MEZCQ3YS.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="styles-MEZCQ3YS.css"></noscript></head>
  <body>

    <!-- ═══════════════════════════════════════════
         LOADER — disparaît dès qu'Angular est prêt
         ═══════════════════════════════════════════ -->
    <div id="netpro-loader">
      <div class="nl-bg"></div>

      <div class="nl-ripple-wrap">
        <div class="nl-ripple"></div><div class="nl-ripple"></div>
        <div class="nl-ripple"></div><div class="nl-ripple"></div>

      <div class="nl-bubbles" id="nlBubbles"></div>

                <stop stop-color="#1DA1F2"/>
                <stop offset="1" stop-color="#1F9D55"/>
              </linearGradient>

            <path d="M50 18 C50 18 28 42 28 57 C28 69.6 37.9 80 50 80 C62.1 80 72 69.6 72 57 C72 42 50 18 50 18Z" fill="url(#nlDrop)" opacity=".92"/>

        <div class="nl-divider"></div>

        <div class="nl-progress-wrap">
          <div class="nl-track">
            <div class="nl-fill" id="nlBar"></div>

    <!-- ═══════════════════════════════════════════
         APP ANGULAR — inchangé
         ═══════════════════════════════════════════ -->
    <app-root></app-root>

    <script>
      /* ── Bulles ─────────────────────────────── */
      (function() {
        const wrap   = document.getElementById('nlBubbles');
        const colors = ['rgba(29,161,242,.35)','rgba(31,157,85,.3)','rgba(29,161,242,.18)','rgba(31,157,85,.18)'];
        for (let i = 0; i < 30; i++) {
          const b = document.createElement('div');
          b.className = 'nl-bubble';
          const s = 4 + Math.random() * 14;
          b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;`
            + `background:${colors[~~(Math.random()*4)]};border:1px solid rgba(255,255,255,.08);`
            + `animation-duration:${5+Math.random()*9}s;animation-delay:${Math.random()*8}s;`;
          wrap.appendChild(b);
        }
      })();

      /* ── Progression ────────────────────────── */
      const nlBar    = document.getElementById('nlBar');
      const nlPct    = document.getElementById('nlPct');
      const nlStep   = document.getElementById('nlStep');
      const nlStatus = document.getElementById('nlStatus');
      const nlLoader = document.getElementById('netpro-loader');

      const nlSteps = [
        { at:0,  label:'Connexion…',    msg:'Initialisation…' },
        { at:25, label:'Ressources…',   msg:'Chargement des ressources…' },
        { at:55, label:'Interface…',    msg:'Mise en place de l\'interface…' },
        { at:80, label:'Finalisation…', msg:'Presque prêt…' },
        { at:98, label:'Prêt !',        msg:'Bienvenue ✦' },
      ];

      let nlProgress = 0;
      const nlIv = setInterval(() => {
        const sp = nlProgress < 50 ? 1.6 + Math.random()*1.4
                 : nlProgress < 80 ? 0.7 + Math.random()*0.8
                 :                    0.25 + Math.random()*0.35;

        nlProgress = Math.min(nlProgress + sp, 99); /* s'arrête à 99% — Angular finit */
        nlBar.style.width = nlProgress + '%';
        nlPct.textContent = Math.floor(nlProgress) + '%';

        const s = [...nlSteps].reverse().find(s => nlProgress >= s.at);
        if (s) { nlStep.textContent = s.label; nlStatus.textContent = s.msg; }
      }, 55);

      /* ── Angular signale qu'il est prêt ─────── */
      /* Dès que <app-root> reçoit du contenu, on termine */
      const observer = new MutationObserver(() => {
        const appRoot = document.querySelector('app-root');
        if (appRoot && appRoot.children.length > 0) {
          observer.disconnect();
          clearInterval(nlIv);

          /* Sauter à 100% */
          nlProgress = 100;
          nlBar.style.width = '100%';
          nlPct.textContent = '100%';
          nlStep.textContent = 'Prêt !';
          nlStatus.textContent = 'Bienvenue ✦';

          setTimeout(() => {
            nlLoader.classList.add('fade-out');
            setTimeout(() => nlLoader.remove(), 950);
          }, 500);
        }
      });

      observer.observe(document.querySelector('app-root'), { childList: true, subtree: true });
    </script>
