<section id="services" class="services">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">{{ translationService.t('services.title') }}</h2>
      <div class="title-underline"></div>
    </div>

    <div class="services-grid">
      @for (service of services; track service.id) {
        <div class="service-card">
          <div class="service-image">
            <img [src]="service.image" [alt]="translationService.t(service.titleKey)">
            <div class="service-overlay"></div>
          </div>
          <div class="service-content">
            <h3 class="service-title">{{ translationService.t(service.titleKey) }}</h3>
            <p class="service-description">{{ translationService.t(service.descKey) }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
