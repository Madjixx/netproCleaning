<header [class.scrolled]="isScrolled">
  <div class="container">
    <div class="logo">
      <img [src]="logoSrc" alt="NetPro Cleaning" (error)="onImageError()" loading="eager">
    </div>

    <button class="mobile-menu-btn" (click)="toggleMobileMenu()" [class.open]="isMobileMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav [class.mobile-open]="isMobileMenuOpen">
      <a (click)="scrollToSection('accueil')">{{ translationService.t('nav.home') }}</a>
      <a (click)="scrollToSection('services')">{{ translationService.t('nav.services') }}</a>
      <a (click)="scrollToSection('valeurs')">{{ translationService.t('nav.values') }}</a>
      <a (click)="scrollToSection('about')">{{ translationService.t('nav.about') }}</a>
      <a (click)="scrollToSection('contact')">{{ translationService.t('nav.contact') }}</a>
    </nav>

    <div class="language-selector">
      <button class="lang-dropdown-btn" (click)="toggleLanguageDropdown()">
        <img [src]="getLanguageFlag(currentLanguage)" [alt]="currentLanguage">
        <span>{{currentLanguage | uppercase}}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 10l5 5 5-5z"/>
        </svg>
      </button>
      <div class="lang-dropdown-menu" [class.open]="isLanguageDropdownOpen">
        <button class="lang-option" (click)="selectLanguage('fr')">
          <img [src]="getLanguageFlag('fr')" alt="Français">
          <span>Français</span>
        </button>
        <button class="lang-option" (click)="selectLanguage('en')">
          <img [src]="getLanguageFlag('en')" alt="English">
          <span>English</span>
        </button>
         <button class="lang-option" (click)="selectLanguage('nl')">
          <img [src]="getLanguageFlag('nl')" alt="Nederlands">
          <span>Nederlands</span>
        </button>
      </div>
    </div>

    <a href="tel:+32477209989" class="phone-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      0477 20 99 89
    </a>
  </div>
</header>
