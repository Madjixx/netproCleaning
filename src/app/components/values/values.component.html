<section class="values">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">{{ translationService.t('values.title') }}</h2>
      <div class="title-underline"></div>
    </div>

    <div class="values-grid">
      @for (value of values; track value.id) {
        <div class="value-card">
          <div class="value-icon">
            <div class="icon-circle">
              @if (value.id === 1) {
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
              } @else if (value.id === 2) {
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                  <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
              } @else if (value.id === 3) {
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
              } @else {
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <polyline points="12 6 12 12 16 14"/>
                </svg>
              }
            </div>
          </div>
          <h3 class="value-title">{{ translationService.t(value.titleKey) }}</h3>
          <p class="value-description">{{ translationService.t(value.descKey) }}</p>
        </div>
      }
    </div>
  </div>
</section>
